<!DOCTYPE html>

<title>Mallorentec · Design System v1.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ds-tokens.css">
<style>
  /* Sticky nav */
  .ml-nav {
    position: sticky; top: 0; z-index: 50;
    background: rgba(42, 61, 102, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1.5px solid var(--ml-line);
    padding: 14px 48px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .ml-nav a { color: var(--ml-crema); text-decoration: none; margin-left: 18px; font-family: var(--ml-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.7; transition: color var(--ml-dur) var(--ml-ease); }
  .ml-nav a:hover { color: var(--ml-tomate); opacity: 1; }
  .ml-nav .brand { font-family: var(--ml-display); font-weight: 700; letter-spacing: -0.02em; font-size: 18px; }
  .ml-nav .brand span { color: var(--ml-tomate); }
</style>
</head>
<body>
<nav class="ml-nav">

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
